name: unpack
on: {workflow_dispatch: {}, push: {paths: [us-app-upload.zip]}}
permissions: {contents: write}
jobs: {u: {runs-on: ubuntu-latest, steps: [{uses: "actions/checkout@v4"}, {run: "unzip -o us-app-upload.zip && rm us-app-upload.zip && git config user.name bot && git config user.email bot@users.noreply.github.com && git add -A && git commit -m 'Add Us App source' && git push"}]}}
